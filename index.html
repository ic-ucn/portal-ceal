<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#f4f7fb" />
  <meta name="color-scheme" content="light" />
  <meta name="robots" content="noindex, nofollow, noarchive" />
  <meta name="referrer" content="no-referrer" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; font-src 'self'; style-src 'self'; script-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'" />
  <title>Datos de transferencia | CEIC UCN</title>
  <meta name="description" content="Datos de la cuenta CEAL para realizar transferencias." />
  <link rel="icon" href="assets/logo-mark-transparent.png" />
  <link rel="apple-touch-icon" href="assets/logo-mark-transparent.png" />
  <link rel="preload" href="assets/fonts/InterVariable.woff2?v=1" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="assets/fonts/FrauncesVariable.woff2?v=1" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="src/transfer.css?v=20260901b" />
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="https://ceicucn.cl/" aria-label="CEIC UCN, inicio">
        <img src="assets/logo-horizontal-transparent.png" alt="CEIC UCN, Ingeniería Civil UCN" />
      </a>
      <span class="payment-status"><span aria-hidden="true"></span>Transferencia</span>
    </div>
  </header>

  <main>
    <section class="intro" aria-labelledby="page-title">
      <p class="eyebrow">Cuenta CEAL</p>
      <h1 id="page-title">Datos para transferir</h1>
    </section>

    <section class="transfer-panel" aria-labelledby="transfer-title">
      <div class="panel-heading">
        <div>
          <p class="section-label">Mercado Pago</p>
          <h2 id="transfer-title">Cuenta Vista</h2>
        </div>
      </div>

      <button class="copy-all-button" type="button" data-copy-all>
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect width="14" height="14" x="8" y="8" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></svg>
        <span>Copiar todos los datos</span>
      </button>

      <div class="account-list" aria-label="Datos bancarios">
        <button class="account-row" type="button" data-copy-value="Belén Alessandra Astudillo Díaz" data-copy-label="Nombre">
          <span><small>Nombre</small><strong>Belén Alessandra Astudillo Díaz</strong></span>
          <span class="copy-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><rect width="14" height="14" x="8" y="8" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></svg></span>
        </button>
        <button class="account-row" type="button" data-copy-value="21010841-6" data-copy-label="RUT">
          <span><small>RUT</small><strong>21.010.841-6</strong></span>
          <span class="copy-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><rect width="14" height="14" x="8" y="8" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></svg></span>
        </button>
        <div class="account-row account-row-static">
          <span><small>Banco</small><strong>Mercado Pago</strong></span>
        </div>
        <div class="account-row account-row-static">
          <span><small>Tipo de cuenta</small><strong>Cuenta Vista</strong></span>
        </div>
        <button class="account-row account-number" type="button" data-copy-value="1062801369" data-copy-label="Número de cuenta">
          <span><small>Número de cuenta</small><strong>1062801369</strong></span>
          <span class="copy-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><rect width="14" height="14" x="8" y="8" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></svg></span>
        </button>
        <button class="account-row" type="button" data-copy-value="belen.astu24@gmail.com" data-copy-label="Correo">
          <span><small>Correo</small><strong>belen.astu24@gmail.com</strong></span>
          <span class="copy-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><rect width="14" height="14" x="8" y="8" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></svg></span>
        </button>
      </div>

      <p class="copy-help">Toca una fila para copiar únicamente ese dato.</p>
    </section>

  </main>

  <footer>
    <img src="assets/logo-mark-transparent.png" alt="" aria-hidden="true" />
    <span>CEIC UCN · Ingeniería Civil UCN</span>
  </footer>

  <div class="copy-toast" role="status" aria-live="polite" aria-atomic="true" hidden></div>
  <script src="src/transfer.js?v=20260901b"></script>
</body>
</html>
